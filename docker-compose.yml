services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: charge_station
      POSTGRES_USER: charge
      POSTGRES_PASSWORD: charge
    ports:
      - "127.0.0.1:${CHARGE_STATION_POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charge -d charge_station"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - charge-station-postgres:/var/lib/postgresql/data

  charge-station-api:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${CHARGE_STATION_API_ORIGIN:-http://localhost:4000}
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @charge-station/api db:seed && pnpm --filter @charge-station/api start",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      core-iot-device-simulator:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://charge:charge@postgres:5432/charge_station
      JWT_SECRET: development-jwt-secret-change-me
      ADMIN_EMAIL: admin@charge.local
      ADMIN_PASSWORD: local-admin-password-change-me
      STATION_QR_ENCRYPTION_KEY: 4d8eae9b3271c5f079cfb8b4f14ba3ca9d7e6a0b4c32f807c2d2ab5e983f1140
      FRONTEND_URL: ${CHARGE_STATION_WEB_ORIGIN:-http://localhost:3100}
      IOT_CORE_PUBLIC_URL: http://host.docker.internal:18090
      IOT_CORE_ACCESS_TOKEN: ${IOT_CORE_ACCESS_TOKEN:?Set IOT_CORE_ACCESS_TOKEN in the shell that starts Compose}
      IOT_CORE_DEVICE_ID: ${IOT_CORE_DEVICE_ID:?Set IOT_CORE_DEVICE_ID in the shell that starts Compose}
      IOT_CORE_RELAY_ID: ${IOT_CORE_RELAY_ID:-relay-1}
      IOT_CORE_COMMAND_TIMEOUT_MS: ${IOT_CORE_COMMAND_TIMEOUT_MS:-10000}
      IOT_CORE_COMMAND_POLL_MS: ${IOT_CORE_COMMAND_POLL_MS:-250}
      IOT_CORE_TELEMETRY_POLL_MS: ${IOT_CORE_TELEMETRY_POLL_MS:-2000}
      IOT_CORE_TELEMETRY_STALE_MS: ${IOT_CORE_TELEMETRY_STALE_MS:-15000}
      PAYOS_MODE: mock
      PAYOS_CLIENT_ID: local-client-id
      PAYOS_API_KEY: local-api-key
      PAYOS_CHECKSUM_KEY: local-checksum-key
      PAYOS_MOCK_CHECKOUT_BASE_URL: ${CHARGE_STATION_API_ORIGIN:-http://localhost:4000}
      PAYOS_RETURN_URL: ${CHARGE_STATION_API_ORIGIN:-http://localhost:4000}/payments/payos/return
      PAYOS_CANCEL_URL: ${CHARGE_STATION_API_ORIGIN:-http://localhost:4000}/payments/payos/cancel
      PAYMENT_RESERVATION_TTL_MINUTES: 15
      PAYMENT_REAPER_INTERVAL_MS: 60000
    ports:
      - "127.0.0.1:${CHARGE_STATION_API_HOST_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  core-iot-device-simulator:
    build:
      context: ./apps/core-iot-device-simulator
    environment:
      IOT_CORE_MQTT_HOST: host.docker.internal
      IOT_CORE_MQTT_PORT: "18893"
      IOT_CORE_DEVICE_TOKEN: ${IOT_CORE_DEVICE_TOKEN:?Run the Core E2E harness or set IOT_CORE_DEVICE_TOKEN in the shell that starts Compose}
      IOT_SIMULATOR_TELEMETRY_INTERVAL_SECONDS: ${IOT_SIMULATOR_TELEMETRY_INTERVAL_SECONDS:-1}
      IOT_SIMULATOR_READINESS_FILE: /tmp/core-iot-device-simulator.ready
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os; from pathlib import Path; raise SystemExit(0 if Path(os.environ['IOT_SIMULATOR_READINESS_FILE']).is_file() else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${CHARGE_STATION_API_ORIGIN:-http://localhost:4000}
    command:
      [
        "pnpm",
        "--filter",
        "@charge-station/web",
        "start",
        "--hostname",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    depends_on:
      charge-station-api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${CHARGE_STATION_API_ORIGIN:-http://localhost:4000}
    ports:
      - "127.0.0.1:${CHARGE_STATION_WEB_HOST_PORT:-3100}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  charge-station-postgres:
